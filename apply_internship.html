<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Internship - HAN INTERN HUB</title>

    <link rel="stylesheet" href="static/css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container py-5 mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg border-0">

                <!-- Header -->
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 text-center">
                        Internship Application Form
                    </h4>
                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <form id="internshipApplicationForm">

                        <div class="row g-3">

                            <!-- Title -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Title of Internship
                                </label>

                                <input
                                    type="text"
                                    name="title_of_internship"
                                    class="form-control"
                                    required>
                            </div>

                            <!-- Student Name -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Student Name
                                </label>

                                <input
                                    type="text"
                                    name="student_name"
                                    class="form-control"
                                    required>
                            </div>

                            <!-- Registration -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Registration Number
                                </label>

                                <input
                                    type="text"
                                    name="registration_number"
                                    class="form-control"
                                    required>
                            </div>

                            <!-- Course -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Course
                                </label>

                                <input
                                    type="text"
                                    name="course"
                                    class="form-control">
                            </div>

                            <!-- Specialization -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Specialization
                                </label>

                                <input
                                    type="text"
                                    name="specialization"
                                    class="form-control">
                            </div>

                            <!-- Year -->
                            <div class="col-md-3">
                                <label class="form-label">
                                    Year
                                </label>

                                <input
                                    type="text"
                                    name="year"
                                    class="form-control">
                            </div>

                            <!-- Semester -->
                            <div class="col-md-3">
                                <label class="form-label">
                                    Semester
                                </label>

                                <input
                                    type="text"
                                    name="semester"
                                    class="form-control">
                            </div>

                            <!-- College -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    College
                                </label>

                                <input
                                    type="text"
                                    name="college"
                                    class="form-control">
                            </div>

                            <!-- University -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    University Name
                                </label>

                                <input
                                    type="text"
                                    name="university_name"
                                    class="form-control">
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>
                            </div>

                            <!-- Contact -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Contact Number
                                </label>

                                <input
                                    type="tel"
                                    name="contact_number"
                                    class="form-control"
                                    required>
                            </div>

                        </div>

                        <div class="text-center mt-4">

                            <button
                                type="submit"
                                class="btn btn-success px-5 py-2">
                                Submit Application
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
document.getElementById("internshipApplicationForm").addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Application form is ready. Submission service will be connected next.");

});
</script>

</body>
</html>
